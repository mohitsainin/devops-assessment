name: CI-CD Pipeline (Windows Only)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- Debug: Secrets present or not (SAFE) ----
      - name: Debug secrets presence (safe)
        shell: cmd
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if "%DOCKER_USERNAME%"=="" echo USERNAME NOT SET
          if "%DOCKER_PASSWORD%"=="" echo PASSWORD NOT SET
          if NOT "%DOCKER_USERNAME%"=="" echo USERNAME SET
          if NOT "%DOCKER_PASSWORD%"=="" echo PASSWORD SET

      # ---- Docker Login (SECURE) ----
      - name: Docker Login
        shell: cmd
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo %DOCKER_PASSWORD% | docker login -u %DOCKER_USERNAME% --password-stdin

      # ---- Build & Push Backend ----
      - name: Build & Push Backend
        shell: cmd
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build -t %DOCKER_USERNAME%/devops-backend:latest backend
          docker push %DOCKER_USERNAME%/devops-backend:latest

      # ---- Build & Push Frontend ----
      - name: Build & Push Frontend
        shell: cmd
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build -t %DOCKER_USERNAME%/devops-frontend:latest frontend
          docker push %DOCKER_USERNAME%/devops-frontend:latest
