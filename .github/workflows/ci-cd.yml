name: CI-CD Pipeline

on:
  push:
    branches:
      - main 

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Login
        shell: powershell
        run: |
          "${{ secrets.DOCKER_PASSWORD }}" | docker login `
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Backend Image
        shell: powershell
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-backend ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/devops-backend

      - name: Build & Push Frontend Image
        shell: powershell
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-frontend ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/devops-frontend
