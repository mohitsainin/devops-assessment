name: CI-CD Pipeline (Windows Only - DEBUG)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- HARD-CODED DEBUG LOGIN (TEMPORARY) ----
      - name: Docker Login (DEBUG)
        shell: cmd
        run: |
          echo DEBUG_TOKEN_HERE | docker login -u DEBUG_USERNAME_HERE --password-stdin

      # ---- Build & Push Backend ----
      - name: Build & Push Backend
        shell: cmd
        run: |
          docker build -t DEBUG_USERNAME_HERE/devops-backend:latest backend
          docker push DEBUG_USERNAME_HERE/devops-backend:latest

      # ---- Build & Push Frontend ----
      - name: Build & Push Frontend
        shell: cmd
        run: |
          docker build -t DEBUG_USERNAME_HERE/devops-frontend:latest frontend
          docker push DEBUG_USERNAME_HERE/devops-frontend:latest
