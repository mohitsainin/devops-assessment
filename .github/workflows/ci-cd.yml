name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build & Push Backend
        run: |
          docker build -t rishisingh/devops-backend ./backend
          docker push rishisingh/devops-backend

      - name: Build & Push Frontend
        run: |
          docker build -t rishisingh/devops-frontend ./frontend
          docker push rishisingh/devops-frontend
