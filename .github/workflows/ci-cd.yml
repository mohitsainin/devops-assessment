name: CI-CD Pipeline (Windows Only)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Login
        shell: powershell
        run: |
          $password = "${{ secrets.DOCKER_PASSWORD }}"
          $password | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Backend
        shell: powershell
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-backend:latest .\backend
          docker push ${{ secrets.DOCKER_USERNAME }}/devops-backend:latest

      - name: Build & Push Frontend
        shell: powershell
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-frontend:latest .\frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/devops-frontend:latest
